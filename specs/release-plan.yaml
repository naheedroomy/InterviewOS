release:
  version: 3.3.0
  codename: Trustworthy Interview Lifecycle
  status: planning
  semantic_release: true
  bump_hint: minor
  version_note: >-
    This is a planning label only. The release tag is determined by the
    repository's semantic-release process.

initiative:
  id: phase-0
  scope: specs/product/SCOPE_LATEST.yaml

# Ordered by WSJF: (business value + time criticality + risk reduction)
# divided by job size.
epics:
  - id: e01
    title: Data routing integrity
    wsjf: 7.0
    capsule_dir: epics/e01-data-routing
    total_bcps: 8
    note: >-
      Prevents private interview content from reaching unapproved providers.
  - id: e02
    title: Meeting persistence integrity
    wsjf: 6.5
    capsule_dir: epics/e02-meeting-integrity
    total_bcps: 13
    note: >-
      Prevents duplicated, lost, and phantom sensitive interview records.
  - id: e03
    title: Consent and truthful telemetry
    wsjf: 6.0
    capsule_dir: epics/e03-consent-telemetry
    total_bcps: 5
    note: >-
      Makes legal acceptance and telemetry processing trustworthy before use.
  - id: e04
    title: Electron desktop boundary
    wsjf: 5.8
    capsule_dir: epics/e04-electron-boundary
    total_bcps: 8
    note: >-
      Reduces the desktop impact of compromised or remotely supplied renderer
      code.
  - id: e05
    title: User data lifecycle
    wsjf: 5.4
    capsule_dir: epics/e05-data-lifecycle
    total_bcps: 13
    note: >-
      Makes deletion and displayed retention choices reliable and observable.
  - id: e06
    title: Database migration safety
    wsjf: 4.8
    capsule_dir: epics/e06-migration-safety
    total_bcps: 5
    note: >-
      Prevents a failed upgrade from silently becoming a permanent data defect.
  - id: e07
    title: Behavior and desktop quality gates
    wsjf: 4.4
    capsule_dir: epics/e07-quality-gates
    total_bcps: 16
    note: >-
      Establishes executable evidence for sensitive-data and Electron behavior.
  - id: e08
    title: Release and platform truthfulness
    wsjf: 3.9
    capsule_dir: epics/e08-release-truth
    total_bcps: 8
    note: >-
      Aligns advertised platforms, download selection, package contents, and
      tests.

bugs:
  total: 0
  fixed: 0
  deferred: 0
  wontfix: 0
  open: 0
  registry: null
